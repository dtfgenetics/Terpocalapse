name: Terpocalypse Veg Lab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production-control documents
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            docs/GAME_BIBLE.md
            docs/ASSET_BIBLE.md
            docs/NO_DOOM_IP_RULES.md
            docs/LICENSING_NOTES.md
            docs/ACCESSIBILITY_REQUIREMENTS.md
            docs/ENGINE_REQUIREMENTS.md
            docs/DEPLOYMENT_PLAN.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing production control: $file" >&2; exit 1; }
          done

      - name: Reject commercial game archives and ripped-data containers
        shell: bash
        run: |
          set -euo pipefail
          bad="$(find . -type f \( -iname '*.wad' -o -iname '*.iwad' -o -iname '*.pwad' \) -print)"
          if [[ -n "$bad" ]]; then
            echo 'Commercial-game/WAD data is prohibited:' >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: Validate Veg Lab game logic and runtime contract
        working-directory: prototypes/web-fps
        run: npm run verify

      - name: Verify release-candidate browser shell
        shell: bash
        run: |
          set -euo pipefail
          test -s prototypes/web-fps/index.html
          test -s prototypes/web-fps/styles.css
          test -s prototypes/web-fps/styles-v2.css
          test -s prototypes/web-fps/src/main-v2.js
          test -s prototypes/web-fps/src/mission-core.js
          grep -Fq 'The Veg Lab' prototypes/web-fps/index.html
          grep -Fq 'main-v2.js' prototypes/web-fps/src/boot-safe.js
          grep -Fq 'mobileControls' prototypes/web-fps/index.html
          grep -Fq 'runSummary' prototypes/web-fps/index.html

      - name: Install Chromium smoke-test dependency
        working-directory: prototypes/web-fps
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Play through release candidate in Chromium
        working-directory: prototypes/web-fps
        run: npm run test:browser
