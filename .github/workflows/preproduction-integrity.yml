name: Terpocalypse Prototype Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify production-control documents
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            docs/GAME_BIBLE.md
            docs/ASSET_BIBLE.md
            docs/NO_DOOM_IP_RULES.md
            docs/LICENSING_NOTES.md
            docs/ACCESSIBILITY_REQUIREMENTS.md
            docs/ENGINE_REQUIREMENTS.md
            docs/DEPLOYMENT_PLAN.md
            prototypes/web-fps-v2/index.html
            prototypes/web-fps-v2/src/app.js
            prototypes/web-fps-v2/package.json
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing Terpocalypse control/runtime file: $file" >&2; exit 1; }
          done

      - name: Reject commercial game archives and obvious ripped-data containers
        shell: bash
        run: |
          set -euo pipefail
          bad="$(find . -type f \( -iname '*.wad' -o -iname '*.iwad' -o -iname '*.pwad' \) -print)"
          if [[ -n "$bad" ]]; then
            echo 'Commercial-game/WAD data is prohibited:' >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: Validate V2 browser runtime
        working-directory: prototypes/web-fps-v2
        run: |
          npm run check
          npm test

      - name: Keep release status truthful
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'playable browser vertical slice' README.md
          grep -Fq 'V2 remains a prototype' prototypes/web-fps-v2/CONTENT_STATUS.md
