name: Terpocalypse Preproduction Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify production-control documents
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            docs/GAME_BIBLE.md
            docs/ASSET_BIBLE.md
            docs/NO_DOOM_IP_RULES.md
            docs/LICENSING_NOTES.md
            docs/ACCESSIBILITY_REQUIREMENTS.md
            docs/ENGINE_REQUIREMENTS.md
            docs/DEPLOYMENT_PLAN.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing preproduction control: $file" >&2; exit 1; }
          done

      - name: Reject commercial game archives and obvious ripped-data containers
        shell: bash
        run: |
          set -euo pipefail
          bad="$(find . -type f \( -iname '*.wad' -o -iname '*.iwad' -o -iname '*.pwad' \) -print)"
          if [[ -n "$bad" ]]; then
            echo 'Commercial-game/WAD data is prohibited:' >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: Validate stable V1 browser vertical slice
        shell: bash
        run: |
          set -euo pipefail
          test -s prototypes/web-fps/index.html
          test -s prototypes/web-fps/main.js
          test -s prototypes/web-fps/game-data.js
          test -s prototypes/web-fps/styles.css
          test -s prototypes/web-fps/visibility-pause-v1.js
          node --check prototypes/web-fps/main.js
          node --check prototypes/web-fps/game-data.js
          node --check prototypes/web-fps/visibility-pause-v1.js
          grep -Fq 'Playable browser vertical slice plus asset-first production.' README.md
          grep -Fq 'visibility-pause-v1.js' prototypes/web-fps/index.html
          grep -Fq "releaseHeldKeyboardControls" prototypes/web-fps/visibility-pause-v1.js
          grep -Fq "'Space'" prototypes/web-fps/visibility-pause-v1.js
          if grep -Fq 'No playable code has been added yet.' README.md; then
            echo 'README still claims the playable prototype does not exist.' >&2
            exit 1
          fi

      - name: Validate V2 browser prototype
        shell: bash
        run: |
          set -euo pipefail
          required=(
            prototypes/web-fps-v2/index.html
            prototypes/web-fps-v2/styles.css
            prototypes/web-fps-v2/src/app.js
            prototypes/web-fps-v2/src/render.js
            prototypes/web-fps-v2/src/input-system.js
            prototypes/web-fps-v2/src/touch-controls.js
            prototypes/web-fps-v2/src/movement-system.js
            prototypes/web-fps-v2/src/tool-system.js
            prototypes/web-fps-v2/src/threat-system.js
            prototypes/web-fps-v2/src/pickup-system.js
            prototypes/web-fps-v2/src/progress-system.js
            prototypes/web-fps-v2/src/special-system.js
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing V2 runtime file: $file" >&2; exit 1; }
          done
          while IFS= read -r file; do
            node --input-type=module --check < "$file"
          done < <(find prototypes/web-fps-v2/src -maxdepth 1 -type f -name '*.js' -print | sort)
          grep -Fq 'id="touchControls"' prototypes/web-fps-v2/index.html
          grep -Fq 'bindTouchControls' prototypes/web-fps-v2/src/app.js
          grep -Fq 'data-action="fire"' prototypes/web-fps-v2/index.html
          grep -Fq 'data-hold-code="KeyW"' prototypes/web-fps-v2/index.html
