name: Deploy Terpocalypse V2 Static Site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'prototypes/web-fps-v2/**'
      - '.github/workflows/terpocalypse-v2-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: terpocalypse-v2-pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/web-fps-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run checks
        run: npm run check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static build
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototypes/web-fps-v2

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
