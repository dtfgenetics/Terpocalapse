name: Deploy Terpocalypse V2 Static Site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'prototypes/web-fps-v2/**'
      - '.github/workflows/terpocalypse-v2-pages.yml'

permissions:
  contents: read

concurrency:
  group: terpocalypse-v2-pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/web-fps-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run checks
        run: npm run check

      - name: Record canonical delivery boundary
        run: |
          echo "GitHub Pages deployment is intentionally retired."
          echo "Terpocalypse is developed in this repository and packaged into the canonical DTFSeeds public suite."
